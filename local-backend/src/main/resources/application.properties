server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/restaurant}
spring.datasource.username=${DB_USERNAME:restaurant}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=restaurant
spring.jpa.open-in-view=false

# Backend cloud (Cloud Run) che gestisce login, registrazione, abbonamenti e email
app.cloud.url=${CLOUD_API_URL:}
# Chiave pubblica JWT (X.509 base64). Se vuota viene scaricata da {cloud}/api/auth/public-key
jwt.public-key=${JWT_PUBLIC_KEY:}
# Se valorizzato, accetta solo token di questo ristorante (un'installazione = un ristorante)
app.local.ristorante-id=${LOCAL_RISTORANTE_ID:}

# Controllo abbonamento: cache dello stato letto dal cloud e tolleranza offline
app.subscription.cache-minutes=${SUBSCRIPTION_CACHE_MINUTES:1440}
app.subscription.offline-grace-days=${SUBSCRIPTION_OFFLINE_GRACE_DAYS:7}

# Stampanti Epson ESC/POS in LAN (host:porta, porta predefinita 9100). Vuote = disattivate
app.print.enabled=${PRINT_ENABLED:false}
app.print.bar=${PRINTER_BAR:}
app.print.cucina=${PRINTER_CUCINA:}
app.print.pizzeria=${PRINTER_PIZZERIA:}
app.print.columns=${PRINT_COLUMNS:42}
