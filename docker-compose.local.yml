# Installazione locale (es. presso un ristorante).
# Avvio:  docker compose -f docker-compose.local.yml up -d --build
# Poi apri http://<IP-del-PC> da qualsiasi dispositivo nella stessa rete Wi-Fi.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurant
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD nel file .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant -d restaurant"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/restaurant
      DB_USERNAME: restaurant
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_USERNAME: restaurant
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # In locale le tabelle vengono create/aggiornate da Hibernate
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:?imposta JWT_SECRET nel file .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      BOOTSTRAP_RESTAURANT_NAME: ${BOOTSTRAP_RESTAURANT_NAME:-Il mio ristorante}
      # Email e Stripe disattivati in locale: nessuna credenziale esterna
      SPRING_MAIL_HOST: localhost
      SPRING_MAIL_PORT: "2525"
      SPRING_MAIL_USERNAME: ""
      SPRING_MAIL_PASSWORD: ""
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  db_data:
