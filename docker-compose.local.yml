# Installazione locale (es. presso un ristorante).
# Avvio:  docker compose -f docker-compose.local.yml up -d --build
# Poi apri http://<IP-del-PC> da qualsiasi dispositivo nella stessa rete Wi-Fi.
#
# Architettura: frontend -> local-backend (dati operativi + DB locale) -> backend cloud
# (login, registrazione, abbonamenti, email). Nessun segreto del cloud e' presente qui.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurant
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD nel file .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant -d restaurant"]
      interval: 5s
      timeout: 5s
      retries: 10

  local-backend:
    build: ./local-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/restaurant
      DB_USERNAME: restaurant
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      CLOUD_API_URL: ${CLOUD_API_URL:?imposta CLOUD_API_URL nel file .env}
      LOCAL_RISTORANTE_ID: ${LOCAL_RISTORANTE_ID:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      SUBSCRIPTION_CACHE_MINUTES: ${SUBSCRIPTION_CACHE_MINUTES:-1440}
      SUBSCRIPTION_OFFLINE_GRACE_DAYS: ${SUBSCRIPTION_OFFLINE_GRACE_DAYS:-7}
      PRINT_ENABLED: ${PRINT_ENABLED:-false}
      PRINTER_BAR: ${PRINTER_BAR:-}
      PRINTER_CUCINA: ${PRINTER_CUCINA:-}
      PRINTER_PIZZERIA: ${PRINTER_PIZZERIA:-}
      PRINT_COLUMNS: ${PRINT_COLUMNS:-42}

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - local-backend
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  db_data:
