<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>Restaurant Hub</title>
    <script>
      // GitHub Pages SPA redirect trick.
      // Codifica il path nel query string e reindirizza a index.html.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/?p=' + encodeURIComponent(l.pathname.slice(1) + (l.search ? l.search : '') + l.hash)
      );
    </script>
  </head>
  <body></body>
</html>
