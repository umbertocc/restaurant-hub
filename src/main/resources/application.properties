# =============================
# Configurazione Database
# =============================
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-eu-central-1.pooler.supabase.com:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres.ijckghwssyjhztzapdqz}
spring.datasource.password=${DB_PASSWORD:Rexton070qwer!}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool HikariCP (consigliato per Supabase free)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1800000

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=restaurant

# =============================
# Server
# =============================
server.port=8080

# URL pubblico del frontend (senza slash finale), usato nei link delle email e nei redirect Stripe
app.frontend-url=${FRONTEND_URL:http://localhost:8080}

# =============================
# JWT
# =============================
# Chiave privata RSA (PKCS#8, base64 su una riga). La chiave pubblica e' esposta su /api/auth/public-key
jwt.private-key=${JWT_PRIVATE_KEY:}

# Account iniziale per installazioni locali (vuoto = disattivato)
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.restaurant-name=${BOOTSTRAP_RESTAURANT_NAME:Il mio ristorante}

# =============================
# Registrazione
# =============================
# Imposta REGISTRATION_CODE come variabile d'ambiente in produzione.
# Se non impostata, la registrazione è disabilitata.
registration.code=${REGISTRATION_CODE:}


# Mail Aruba (conferma prenotazioni)
spring.mail.host=smtps.aruba.it
spring.mail.port=465
spring.mail.username=info@torrepalivacanze.it
spring.mail.password=Rexton070qwer.
spring.mail.protocol=smtps
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =============================
# Billing / Stripe
# =============================
app.billing.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.billing.stripe.webhook-secret=${APP_BILLING_STRIPE_WEBHOOK_SECRET:}
app.billing.stripe.price-pro-monthly=${STRIPE_PRICE_PRO_MONTHLY:}
app.billing.success-url=${BILLING_SUCCESS_URL:${app.frontend-url}/abbonamento?checkout=success}
app.billing.cancel-url=${BILLING_CANCEL_URL:${app.frontend-url}/abbonamento?checkout=cancel}
app.billing.portal-return-url=${BILLING_PORTAL_RETURN_URL:${app.frontend-url}/abbonamento}
app.billing.trial-grace-days=${BILLING_TRIAL_GRACE_DAYS:5}
 
